[package]
name = "ocinye-image-builder"
description = "Builds Ocinye OS images (ISO, QCOW2, RAW) from a verified Ubuntu base and a D011 release (D013)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ocinye-image-builder"
path = "src/main.rs"

[dependencies]
ocinye-image-contracts = { workspace = true }
# PROVISIONAL_PENDING_D011_CERTIFICATION (PD-01/PD-02): the release manifest and canonical JSON.
ocinye-installer-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
ocinye-image-contracts = { workspace = true, features = ["test-support"] }
