[package]
name = "ocinye-oie"
description = "Ocinye Installation Environment: the ISO's disk installer (D013)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ocinye-oie"
path = "src/main.rs"

[dependencies]
ocinye-image-contracts = { workspace = true }
ocinye-installer-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
ocinye-image-contracts = { workspace = true, features = ["test-support"] }
base64 = { workspace = true }
