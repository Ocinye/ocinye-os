# Ocinye OS — local development stack.
#
# Brings up everything the platform needs to run end to end: PostgreSQL with
# pgvector, Redis, S3-compatible object storage and the Identity Provider,
# alongside the Core, Worker and Workspace.
#
# Development only. Every credential here is a placeholder and is expected to be
# overridden per environment; none of these values may ever reach staging or
# production (CLAUDE.md §56).

name: ocinye

services:
  postgres:
    # pgvector image: the extension is required by migration 0006.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocinye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocinye_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-ocinye}
    ports:
      # Ligado ao loopback, e não a todas as interfaces.
      #
      # `- "5442:5432"` publica em `0.0.0.0`: numa rede de que não se é dono,
      # isso é uma base de dados com uma password conhecida à escuta para quem
      # a queira. Esta stack é de desenvolvimento (`CLAUDE.md` §56) e não tem
      # de ser alcançável de outra máquina; quem precisar disso muda a variável.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocinye} -d ${POSTGRES_DB:-ocinye}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      # Loopback, pela mesma razão do PostgreSQL — e o Redis nem password tem.
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # O armazenamento S3-compatível de desenvolvimento: o Garage, como em produção
  # (ADR-0208). A API S3 no porto 9000 do host, em loopback — o mesmo endereço
  # que o MinIO tinha, para que o ambiente de testes não mude.
  garage:
    image: dxflrs/garage@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a
    environment:
      # Só para desenvolvimento. Nunca valores de uma Instância.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-6f63696e79652d6465762d6f6e6c792d7270632d7365637265742d302d302d30}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-ocinye-dev-only-admin-token}
    ports:
      - "${GARAGE_BIND:-127.0.0.1}:${GARAGE_S3_PORT:-9000}:3900"
    volumes:
      - ../garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Layout, chave e bucket privado, uma vez que o Garage está saudável; sai.
  # O mesmo script que produção corre (infra/garage/init.sh), numa imagem mínima
  # com `curl` — o desenvolvimento não tem a imagem do Core.
  garage-init:
    image: curlimages/curl@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-ocinye-dev-only-admin-token}
      OCINYE_GARAGE_ADMIN_URL: http://garage:3903
      OCINYE_STORAGE_ACCESS_KEY: ${OCINYE_STORAGE_ACCESS_KEY:-GK6f63696e79652d6465762d31}
      OCINYE_STORAGE_SECRET_KEY: ${OCINYE_STORAGE_SECRET_KEY:-6f63696e79652d6465762d6f6e6c792d73332d7365637265742d302d302d3030}
      OCINYE_STORAGE_BUCKET: ${OCINYE_STORAGE_BUCKET:-ocinye-artifacts}
    volumes:
      - ../garage/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

volumes:
  postgres-data:
  redis-data:
  garage-meta:
  garage-data:
