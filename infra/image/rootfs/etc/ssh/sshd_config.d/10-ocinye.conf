# Ocinye OS image (D013) — infra/image/rootfs. Host keys exist only after
# ocinye-firstboot has generated them (F1); none ships in the image.
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_ecdsa_key
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60
AllowUsers ocinye ocinye-claim

Match User ocinye-claim
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/lib/ocinye/ocinye-firstboot authorized-keys %u %f %t %k
    AuthorizedKeysCommandUser ocinye-claim-akc
    PermitTTY no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
