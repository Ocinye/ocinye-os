# Ocinye OS image (D013), virt profile. Cloud metadata is untrusted input:
# it may name the host, give `ocinye` public keys and configure the network,
# and nothing else. Scripts, packages, files and other users are disabled by
# removing their modules. (The metal profile ships /etc/cloud/cloud-init.disabled.)
system_info:
  default_user:
    name: ocinye
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
ssh_pwauth: false
disable_root: true
ssh_deletekeys: false
ssh_genkeytypes: []
preserve_hostname: false
cloud_init_modules: [seed_random, growpart, resizefs, set_hostname, update_hostname, update_etc_hosts, users_groups, ssh]
cloud_config_modules: [timezone]
cloud_final_modules: [ssh_authkey_fingerprints, final_message]
datasource:
  NoCloud: {}
vendor_data:
  enabled: false
vendor_data2:
  enabled: false
