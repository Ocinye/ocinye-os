# Peças partilhadas pelos três hosts do Ocinye OS.

# ── O IP real, e só quando é mesmo da Cloudflare ─────────────────────────
#
# `CF-Connecting-IP` é um cabeçalho como outro qualquer: quem fala directamente
# com o origin pode escrevê-lo com o valor que quiser. Confiar nele sem saber de
# onde veio a ligação é deixar qualquer pessoa escolher o seu próprio endereço —
# e com ele contornar throttling, audit e qualquer decisão que dependa de quem
# está do outro lado.
#
# Por isso o `real_ip_header` só se aplica depois de `set_real_ip_from`, que é
# gerado a partir da lista oficial da Cloudflare em
# `/etc/ocinye/nginx/01-cloudflare-ranges.conf`. Fora desses ranges, o IP real é
# o da ligação, e o cabeçalho é ignorado.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ── WebSocket ────────────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# Tempo suficiente para uma ligação de tempo real ficar aberta sem que o proxy
# a corte por a achar inactiva. Uma conversa sem mensagens durante cinco minutos
# continua a ser uma conversa.
proxy_read_timeout  3600s;
proxy_send_timeout  3600s;

# ── O que o browser recebe de nós ────────────────────────────────────────
#
# A CSP vive na aplicação, que é quem sabe o que a página precisa. Aqui ficam
# só os cabeçalhos que não dependem do conteúdo.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

server_tokens off;
