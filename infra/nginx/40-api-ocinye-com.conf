# `api.ocinye.com` — o Ocinye Core.
#
# A autoridade institucional, exposta no seu próprio hostname. Publicá-lo não o
# transforma num segundo produto: continua a ser o mesmo Core, com o mesmo
# prefixo `/api/v1`, e o hostname não redefine fronteiras de autoridade.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name api.ocinye.com;

    ssl_certificate     /etc/nginx/tls/origin-ca.pem;
    ssl_certificate_key /etc/nginx/tls/origin-ca.key;

    client_max_body_size 80m;
    client_body_timeout  300s;

    location / {
        set $destino_core http://core:8080;
        proxy_pass $destino_core;
    }
}
