# `os.ocinye.com` — o Ocinye Workspace.
#
# A Experience humana. Serve páginas renderizadas no servidor, e o browser fala
# **só** com este hostname: as chamadas ao Core são servidor-a-servidor, do
# outro lado desta linha, e por isso não há aqui CORS nenhum para configurar.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name os.ocinye.com;

    ssl_certificate     /etc/nginx/tls/origin-ca.pem;
    ssl_certificate_key /etc/nginx/tls/origin-ca.key;

    # O corpo máximo que o browser pode enviar numa só ligação.
    #
    # Os ficheiros de research workspace sobem **em pedaços** (≤40 MB por parte,
    # ADR-0605), e para esses 80 MB chegavam. Mas os ficheiros **pessoais** sobem
    # num único `POST` para `/me/files/uploads`, e o Workspace aceita-os até ao
    # seu limite lógico (`FILE_BODY_LIMIT_BYTES`, 640 MB). Com o proxy em 80 MB,
    # um ficheiro pessoal maior do que isso não chegava sequer ao Workspace: a
    # ligação parava a meio e a barra de progresso congelava perto de zero, sem
    # dizer porquê. Alinhar o proxy com o limite que a aplicação já promete.
    client_max_body_size 640m;
    client_body_timeout  300s;

    location / {
        set $destino_workspace http://workspace:8090;
        proxy_pass $destino_workspace;
    }
}
