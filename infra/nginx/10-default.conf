# O servidor por omissão: recusa.
#
# # Porquê
#
# Sem ele, o primeiro `server` do ficheiro responde a qualquer `Host` — e a
# qualquer pedido feito directamente a `195.20.246.118`. O Workspace passaria a
# ser alcançável por IP, fora da Cloudflare, sem WAF e sem as regras do edge.
#
# 444 e não 403: fecha a ligação sem escrever resposta. Quem sonda o IP à
# procura de origens atrás da Cloudflare não recebe sequer a confirmação de que
# há aqui um nginx.
# O par que o origin apresenta é o **Cloudflare Origin CA**, e não um
# auto-assinado.
#
# Os nomes eram `origin.pem`/`origin.key` enquanto o certificado era provisório.
# Chamar `origin-ca` ao que está em uso diz de onde ele veio — e diz-o a quem
# leia isto sem ter estado presente no dia em que foi emitido.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/origin-ca.pem;
    ssl_certificate_key /etc/nginx/tls/origin-ca.key;

    return 444;
}
