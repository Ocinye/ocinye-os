# A porta da própria máquina (ADR-0031).
#
# Uma máquina com o Ocinye OS tem um ecrã: quem se senta à frente dela entra
# pelo Session Service, e o Session Service pergunta ao Core. O Core não tem
# porto no host — o único processo com um porto no host é este proxy —, por
# isso esta é a porta por onde essa pergunta entra.
#
# # Porque não é uma segunda porta para o Core
#
# O Compose publica-a **só no loopback do anfitrião** (`127.0.0.1:8480`): de
# fora da máquina não existe. E daqui só passa o que entrar numa máquina
# precisa — entrar, o segundo factor, a política de sessão assinada e a sua
# chave pública, sair. Tudo o resto responde 404 sem chegar ao Core.
server {
    listen 8480;
    server_name _;

    access_log off;

    location = /api/v1/auth/login {
        set $destino_core http://core:8080;
        proxy_pass $destino_core;
    }
    location = /api/v1/auth/logout {
        set $destino_core http://core:8080;
        proxy_pass $destino_core;
    }
    location = /api/v1/auth/mfa/challenge {
        set $destino_core http://core:8080;
        proxy_pass $destino_core;
    }
    location = /api/v1/auth/machine-session {
        set $destino_core http://core:8080;
        proxy_pass $destino_core;
    }
    location = /api/v1/auth/machine-session/key {
        set $destino_core http://core:8080;
        proxy_pass $destino_core;
    }

    location / {
        return 404;
    }
}
