# Peças partilhadas pelo proxy de uma Instância instalada com `install/ocinye`.
#
# A diferença para `infra/nginx/00-comum.conf` (a produção da Ocinye) é uma só,
# e é deliberada: **não há `real_ip_header`**. Lá, o IP real vem da Cloudflare, e
# só é aceite de ranges da Cloudflare. Uma Instância genérica não tem edge
# conhecido à frente, e aceitar um cabeçalho de IP de quem quer que ligue seria
# deixar cada cliente escolher o seu próprio endereço — e com ele contornar o
# throttling. Quem puser um edge à frente acrescenta o seu `set_real_ip_from`.

# Resolução por pedido, pela mesma razão da produção: um serviço em baixo dá
# `502`, em vez de impedir o proxy de arrancar.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_read_timeout  3600s;
proxy_send_timeout  3600s;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

server_tokens off;
