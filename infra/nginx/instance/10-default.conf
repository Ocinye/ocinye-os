# Quem chega sem o nome desta Instância não descobre o que está aqui: `444`
# fecha a ligação sem responder.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/instance.pem;
    ssl_certificate_key /etc/nginx/tls/instance.key;

    return 444;
}
