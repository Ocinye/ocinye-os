# `ocinye.com` — a presença institucional pública.
#
# Reservado ao futuro site institucional. O Workspace **não** vive aqui: a raiz
# do domínio é onde uma instituição se apresenta ao mundo, e a Experience humana
# tem o seu próprio hostname para que a fronteira seja legível de fora.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.ocinye.com;

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;

    # 308 e não 301: preserva o método. Um 301 transforma um POST em GET, e um
    # formulário submetido para `www` chegaria vazio ao destino.
    return 308 https://ocinye.com$request_uri;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name ocinye.com;

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;

    root /srv/site;
    index index.html;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
