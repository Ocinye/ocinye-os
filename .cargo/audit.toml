# Excepções da auditoria de dependências.
#
# Uma entrada aqui é **risco aceite e explicado**, nunca ruído silenciado. Cada
# uma tem de dizer porque não é alcançável, ou o que é feito em vez disso, e sai
# da lista no momento em que deixar de ser verdade (`CLAUDE.md` §54, §70).
#
# Verificado em 2026-08-23 pela Ocinye OS Security Baseline v1.
# Ver docs/security/2026-08-23-security-baseline-v1.md.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack em `rsa 0.9.10`.
    #
    # `rsa` entra apenas por `sqlx-mysql`, e o Ocinye OS usa `sqlx` com
    # `default-features = false` e só o driver `postgres` (ADR-0009). O crate
    # está no `Cargo.lock` porque o Cargo resolve as dependências opcionais dos
    # três drivers, e **não é compilado**: não existe artefacto de `rsa` nem de
    # `sqlx-mysql` em `target/release`.
    #
    # Não há correcção a montante. Sai desta lista quando `sqlx` publicar uma
    # versão que não o arraste, ou se o Ocinye alguma vez falar MySQL — o que
    # exigiria um ADR.
    "RUSTSEC-2023-0071",
]

# Avisos de crates não mantidos e de unsoundness são relatados e não falham a
# auditoria. São sinal para vigiar, não defeitos a corrigir agora:
#
#   RUSTSEC-2024-0436  paste               não mantido, via wasmtime
#   RUSTSEC-2026-0173  proc-macro-error2   não mantido, via leptos
#   RUSTSEC-2026-0253  lru                 unsound em `pop()`, via aws-sdk-s3
#
# O `fxhash` (RUSTSEC-2025-0057) saiu desta lista em 2026-08-25: a `wasmtime`
# 48 deixou de o arrastar. Não foi silenciado — deixou de existir na árvore.
#
# Nenhum tem correcção disponível na versão que a árvore resolve, e nenhum é
# alcançado por entrada não confiável através de código do Ocinye.
