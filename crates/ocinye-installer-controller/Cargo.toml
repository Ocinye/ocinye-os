[package]
name = "ocinye-installer-controller"
description = "The local Rust controller of the Ocinye OS Installer: SSH transport, host-key pinning, the sealed plan, verification and the receipt (D011)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# The headless driver of the same controller, for automated proofs on
# disposable VMs. The graphical Installer (apps/installer) is the product.
name = "ocinye-installer-cli"
path = "src/bin/cli.rs"

[dependencies]
ocinye-contracts = { workspace = true }
ocinye-installer-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
# SSH transport. Without the default features: no `rsa` (RUSTSEC-2023-0071,
# see .cargo/audit.toml) and no compression. Host keys and operator keys are
# Ed25519 or ECDSA; the crypto backend is aws-lc-rs, already in the tree.
russh = { version = "0.64", default-features = false, features = ["aws-lc-rs"] }
# Operator TLS material: parse and check only (no verification library).
x509-parser = { version = "0.18", default-features = false }
rustls-pki-types = { version = "1", features = ["std"] }
aws-lc-rs = "1"
# Operator-side verification (V11–V13).
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
# Synthetic certificates generated inside the tests: no private key is ever
# committed as a fixture.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
