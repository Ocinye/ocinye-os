[package]
name = "ocinye-core"
description = "Ocinye Core — institutional kernel of the Ocinye OS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ocinye-capabilities = { workspace = true }
ocinye-contracts = { workspace = true }
ocinye-domain = { workspace = true }
ocinye-observability = { workspace = true }

sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
image = { workspace = true }
rand = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
unicode-normalization = { workspace = true }
lettre = { workspace = true }
async-imap = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
futures = { workspace = true }
mail-parser = { workspace = true }
ammonia = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-credential-types = { workspace = true }
async-trait = { workspace = true }

[features]
# O fornecedor de inferência determinístico. Activado pelo harness de testes e
# por mais nada: um binário de release não contém este código de todo — não
# apenas inalcançável, ausente (briefing §204).
test-fixtures = []

[dev-dependencies]
tokio = { workspace = true }
# Os testes do avatar constroem fotografias reais em memória e verificam o que
# ficou guardado: sem isto teriam de confiar na mesma biblioteca que estão a
# testar para lhes dizer que o resultado está certo.
image = { workspace = true }
# Auto-dependência para que os testes de integração, que ligam ao crate como
# se fosse externo, alcancem o fixture.
ocinye-core = { path = ".", features = ["test-fixtures"] }
# A suite do `TokenVerifier` levanta um fornecedor de identidade em porta
# efémera. Sem ele os casos negativos seriam impossíveis: nenhum IdP público
# publica um JWKS deformado a pedido, e depender de um tornaria a suite lenta e
# intermitente exactamente onde precisa de ser exacta.
axum = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
