[package]
name = "ocinye-capability-bibtex-import"
description = "Example Ocinye capability: parse BibTeX into institutional source records"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[[bin]]
name = "bibtex-import"
path = "src/main.rs"

# Deliberately dependency-light. A capability is untrusted code running in a
# sandbox; every dependency it pulls in is more code inside that sandbox.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
