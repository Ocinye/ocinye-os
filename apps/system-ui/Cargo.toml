# The Ocinye OS native system interface (ADR-0031): sign-in, lock, the top
# bar, Quick Settings and Settings.
#
# Outside the main Cargo workspace on purpose, like the Installer: it links the
# system webview (WebKitGTK), and the host workspace builds on machines that
# have no desktop libraries. It decides nothing: it presents what the System
# Service and the Session Service say, and sends them typed requests.
[workspace]

[package]
name = "ocinye-system-ui"
description = "Ocinye OS system interface"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
ocinye-system-contracts = { path = "../../crates/ocinye-system-contracts" }
ocinye-system-client = { path = "../../crates/ocinye-system-client" }
# The typed exchange with the Installation Engine (the installer window).
ocinye-image-contracts = { path = "../../crates/ocinye-image-contracts" }
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Workspace's window trusts exactly one certificate beyond the system's:
# the one this machine's own Instance serves (see `trust_instance`). The
# versions are the ones Tauri's webview already links.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gio = "0.18"

[profile.release]
lto = true
codegen-units = 1
strip = true
