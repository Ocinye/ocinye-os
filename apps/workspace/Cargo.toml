[package]
name = "ocinye-workspace"
description = "Ocinye Workspace — the principal human interface of the Ocinye OS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ocinye_workspace"
path = "src/lib.rs"

[[bin]]
name = "ocinye-workspace"
path = "src/main.rs"

[dependencies]
ocinye-contracts = { workspace = true }
ocinye-observability = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
url = { workspace = true }

[dev-dependencies]
ocinye-observability = { workspace = true }
# Só para a sonda de rotas: leva pedidos ao `Router` real em memória, sem abrir
# socket nenhum. É a peça mínima que prova que `ROUTES` descreve o servidor que
# a aplicação constrói, e não o servidor que julgamos ter construído.
tower = { workspace = true }
